{%- if site.giscus.repo_id != "" and site.giscus.category_id != "" -%}
  <div class="giscus"></div>
  <script>
    // Load giscus with the reader's currently selected theme so the comment
    // widget opens in the same light/dark mode as the page. The theme is kept
    // in sync afterwards by apply() in custom-head.html.
    (function () {
      var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      var s = document.createElement("script");
      s.src = "https://giscus.app/client.js";
      s.setAttribute("data-repo", "{{ site.giscus.repo }}");
      s.setAttribute("data-repo-id", "{{ site.giscus.repo_id }}");
      s.setAttribute("data-category", "{{ site.giscus.category }}");
      s.setAttribute("data-category-id", "{{ site.giscus.category_id }}");
      s.setAttribute("data-mapping", "{{ site.giscus.mapping | default: 'pathname' }}");
      s.setAttribute("data-strict", "1");
      s.setAttribute("data-reactions-enabled", "1");
      s.setAttribute("data-emit-metadata", "0");
      s.setAttribute("data-input-position", "top");
      s.setAttribute("data-theme", theme);
      s.setAttribute("data-lang", "en");
      s.crossOrigin = "anonymous";
      s.async = true;
      document.currentScript.parentNode.appendChild(s);
    })();
  </script>
{%- endif -%}
