<script>
  // Theme selection. Applied before first paint to avoid a flash of the wrong theme.
  // Only "light"/"dark" are valid; anything else falls back to dark.
  (function () {
    var VALID = { light: true, dark: true };
    function stored() {
      try { return localStorage.getItem("theme"); } catch (e) { return null; }
    }
    // Tracks the theme currently applied to the giscus iframe. Starts at "dark"
    // to match the data-theme on the static embed, so we only postMessage when it
    // actually needs to change (avoids reloading the iframe in a loop).
    var giscusTheme = "dark";
    function setGiscusTheme(theme) {
      if (theme === giscusTheme) return;
      var frame = document.querySelector("iframe.giscus-frame");
      if (!frame) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        "https://giscus.app"
      );
      giscusTheme = theme;
    }
    function apply(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      setGiscusTheme(theme); // keep the comment widget in the same mode
    }
    var current = stored();
    apply(VALID[current] ? current : "dark");

    document.addEventListener("DOMContentLoaded", function () {
      var menu = document.querySelector(".theme-menu");
      if (!menu) return;
      menu.addEventListener("click", function (event) {
        var button = event.target.closest("[data-set-theme]");
        if (!button) return;
        var theme = button.getAttribute("data-set-theme");
        if (!VALID[theme]) return;
        apply(theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
        menu.removeAttribute("open"); // close the <details> popover
      });

      // Close the popover when clicking anywhere outside it.
      document.addEventListener("click", function (event) {
        if (menu.hasAttribute("open") && !menu.contains(event.target)) {
          menu.removeAttribute("open");
        }
      });
    });

    // When the giscus iframe reports in (any giscus message), correct its theme
    // to the reader's actual choice — the static embed defaults to dark, so a
    // reader who picked light gets fixed as soon as the widget loads.
    window.addEventListener("message", function (event) {
      if (event.origin !== "https://giscus.app") return;
      if (!event.data || typeof event.data.giscus === "undefined") return;
      var theme = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      setGiscusTheme(theme);
    });
  })();
</script>
